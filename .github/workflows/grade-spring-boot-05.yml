name: Verificar entrega — Codelab Spring Boot 05

on:
  workflow_call:
    inputs:
      challenge_id:
        description: "Identificador del reto a verificar."
        required: true
        type: string
    outputs:
      passed:
        description: "'true' si todas las pruebas de verificación pasaron."
        value: ${{ jobs.grade.outputs.passed }}

jobs:
  grade:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.verdict.outputs.passed }}
    steps:
      - name: Checkout del repositorio que invoca este workflow
        uses: actions/checkout@v4
        with:
          path: student-repo

      - name: Checkout de este repositorio
        uses: actions/checkout@v4
        with:
          repository: devxcape/codelab-grading
          path: grading-repo

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: student-repo/pom.xml

      - name: Detectar el paquete base del proyecto
        id: detect-package
        run: |
          set -e
          MAIN_CLASS=$(grep -rl "@SpringBootApplication" student-repo/src/main/java | head -n1)
          if [ -z "$MAIN_CLASS" ]; then
            echo "No se encontró ninguna clase anotada con @SpringBootApplication en student-repo/src/main/java" >&2
            exit 1
          fi
          PACKAGE=$(grep -m1 "^package " "$MAIN_CLASS" | sed 's/package //; s/;//')
          if [ -z "$PACKAGE" ]; then
            echo "La clase principal ($MAIN_CLASS) no declara 'package'" >&2
            exit 1
          fi
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "Paquete detectado: $PACKAGE (clase principal: $MAIN_CLASS)"

      - name: Preparar la prueba de verificación
        run: |
          set -e
          PACKAGE="${{ steps.detect-package.outputs.package }}"
          PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')
          DEST="student-repo/src/test/java/$PACKAGE_PATH/ClienteVerificationTest.java"
          mkdir -p "$(dirname "$DEST")"
          cp "grading-repo/tests/spring-boot-05/ClienteVerificationTest.java" "$DEST"
          sed -i "1s/^package .*/package $PACKAGE;/" "$DEST"

      - name: Ejecutar pruebas de verificación
        id: run-tests
        working-directory: student-repo
        run: |
          mvn -B -Dtest=ClienteVerificationTest test 2>&1 | tee /tmp/test-output-base.txt
        continue-on-error: true

      - name: Buscar reto adicional asignado
        id: lookup-extra
        run: |
          URL="https://devxcape.github.io/codelab-grading/assignments/${{ github.repository_owner }}.json"
          HTTP_CODE=$(curl -s -o /tmp/extra-assignment.json -w "%{http_code}" "$URL" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Reto adicional encontrado para ${{ github.repository_owner }}."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Sin reto adicional asignado (HTTP $HTTP_CODE)."
          fi

      - name: Preparar y ejecutar el reto adicional
        if: steps.lookup-extra.outputs.found == 'true'
        id: run-extra
        run: |
          set -e
          PACKAGE="${{ steps.detect-package.outputs.package }}"
          PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')
          CLASS_NAME=$(jq -r '.class_name' /tmp/extra-assignment.json)
          DEST="student-repo/src/test/java/$PACKAGE_PATH/$CLASS_NAME.java"
          jq -r '.test_source_base64' /tmp/extra-assignment.json | base64 -d > "$DEST"
          sed -i "1s/^package .*/package $PACKAGE;/" "$DEST"
          cd student-repo
          mvn -B -Dtest="$CLASS_NAME" test 2>&1 | tee /tmp/test-output-extra.txt
        continue-on-error: true

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: student-repo/target/surefire-reports/
          if-no-files-found: ignore

      - name: Resumen de resultados
        if: always()
        run: python3 grading-repo/scripts/summarize_results.py "${{ steps.lookup-extra.outputs.found }}"

      - name: Veredicto
        id: verdict
        run: |
          BASE_OK=false
          grep -q "BUILD SUCCESS" /tmp/test-output-base.txt && BASE_OK=true

          EXTRA_OK=true
          if [ "${{ steps.lookup-extra.outputs.found }}" = "true" ]; then
            EXTRA_OK=false
            grep -q "BUILD SUCCESS" /tmp/test-output-extra.txt 2>/dev/null && EXTRA_OK=true
          fi

          if [ "$BASE_OK" = "true" ] && [ "$EXTRA_OK" = "true" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Todas las pruebas de verificación pasaron."
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "❌ Alguna prueba de verificación falló — revisa los logs de los pasos de ejecución arriba, o el reporte publicado como artifact."
            exit 1
          fi
